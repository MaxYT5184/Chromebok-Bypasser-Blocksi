<!DOCTYPE html>
<html>
<head>
  <title>ChromeBook 45 GB Adder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background-color: #f0f0f0;
    }

    h1 {
      color: #333;
    }

    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background-color: #45a049;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>ChromeBook 45 GB Adder (Safe Version)</h1>
  <button onclick="generateFiles()">Start Download</button>
  <div id="status"></div>

  <script>
    function generateFiles() {
      const numberOfFiles = 5;
      const fileSizeMB = 900; // 900 MB per file
      const content = "This is filler content for testing.\n";
      const repeatCount = Math.floor((1024 * 1024 * fileSizeMB) / content.length);
      const status = document.getElementById("status");

      status.textContent = "Generating files, please wait...";

      let fileIndex = 1;

      function createNextFile() {
        if (fileIndex > numberOfFiles) {
          status.textContent = "All files generated and downloads started.";
          return;
        }

        setTimeout(() => {
          const repeated = content.repeat(repeatCount);
          const blob = new Blob([repeated], { type: "text/plain" });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = `file_${fileIndex}.txt`;
          link.click();
          fileIndex++;
          createNextFile();
        }, 1000); // Wait between files to avoid memory issues
      }

      createNextFile();
    }
  </script>
</body>
</html>
