<!DOCTYPE html>
<html>
<head>
  <title>ChromeBook 1 GB Filler</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background-color: #f7f7f7;
    }

    h1 {
      color: #333;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background-color: #0056b3;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>ChromeBook 1 GB Adder</h1>
  <button onclick="generateFiles()">Start Download</button>
  <div id="status"></div>

  <script>
    function generateFiles() {
      const numberOfFiles = 10;
      const fileSizeMB = 500; // Each file will be ~800MB
      const content = "This is filler content for testing.\n";
      const repeatCount = Math.floor((1024 * 1024 * fileSizeMB) / content.length);
      const status = document.getElementById("status");

      let fileIndex = 1;
      status.textContent = "Starting download...";

      function createNextFile() {
        if (fileIndex > numberOfFiles) {
          status.textContent = "All 5 files (~?GB total) downloaded.";
          return;
        }

        status.textContent = `Creating file ${fileIndex} of ${numberOfFiles}...`;

        setTimeout(() => {
          const repeated = content.repeat(repeatCount);
          const blob = new Blob([repeated], { type: "text/plain" });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = `file_${fileIndex}.txt`;
          link.click();
          fileIndex++;
          createNextFile();
        }, 1000); // 1 second pause between files
      }

      createNextFile();
    }
  </script>
</body>
</html>
