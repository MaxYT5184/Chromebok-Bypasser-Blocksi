<!DOCTYPE html>
<html>
<head>
  <title>ChromeBook 50 GB Adder</title>
</head>
<body>
  <h1>ChromeBook 50 GD Adder</h1>
  <button onclick="generateFiles()">Start Download</button>

  <script>
    function generateFiles() {
      const numberOfFiles = 100; // Change this to 800 if you're testing carefully
      const fileSizeMB = 1,024;
      const content = "This is filler content for testing.\n";
      const repeated = content.repeat((1024 * 1024 * fileSizeMB) / content.length);

      for (let i = 1; i <= numberOfFiles; i++) {
        const blob = new Blob([repeated], { type: "text/plain" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `file_${i}.txt`;
        link.click();
      }
    }
  </script>
</body>
</html>
